services:
  - type: web
    name: gym-ad-screen
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TO_EMAIL
        sync: false
      # - key: DATA_DIR
      #   value: /var/data
    # The free plan's filesystem is wiped on every deploy/restart, which would
    # delete uploaded ads. To keep them, switch `plan` to a paid one (e.g.
    # starter) and uncomment this disk plus DATA_DIR above.
    # disk:
    #   name: ad-data
    #   mountPath: /var/data
    #   sizeGB: 1
